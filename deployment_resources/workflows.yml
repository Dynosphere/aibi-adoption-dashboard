resources:
  jobs:
    adoption_dash_job:
      name: adoption_dashboard_workflow
      tasks:
        - task_key: Ingest_Metadata
          notebook_task:
            notebook_path: ../src/01_get_metadata.ipynb
          # Disable implicit retry — a failure here is informative, and
          # re-running the full V2 SDK fan-out doubles wall-clock for no gain.
          max_retries: 0
        - task_key: Init_Watermarks
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_dim_pipeline_watermarks.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_MatVews
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactDashboardUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Genie
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Init_Watermarks
          sql_task:
            file:
              path: ../src/02_mvFactGenieUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: V3_Housekeeping
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_v3_housekeeping.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_ServingUsage
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Init_Watermarks
            - task_key: V3_Housekeeping
          sql_task:
            file:
              path: ../src/02_mvFactServingUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Apps
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Init_Watermarks
            - task_key: V3_Housekeeping
          sql_task:
            file:
              path: ../src/02_mvFactAppUsage.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_dbsql_cost_per_query
          depends_on:
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_dbsql_cost_per_query.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_Genie_PaygoCost
          depends_on:
            - task_key: Process_dbsql_cost_per_query
            - task_key: Ingest_Metadata
          sql_task:
            file:
              path: ../src/02_mvFactGeniePaygoCost.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_genie_observability
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Init_Watermarks
          sql_task:
            file:
              path: ../src/02_genie_observability_main_table.sql
            warehouse_id: ${var.my_warehouse_id}
        - task_key: Process_VectorSearchCost
          depends_on:
            - task_key: Ingest_Metadata
            - task_key: Init_Watermarks
          sql_task:
            file:
              path: ../src/02_mvFactVectorSearchCost.sql
            warehouse_id: ${var.my_warehouse_id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: skip_get_conversations
          default: ${var.skip_get_conversations}
        - name: enable_genie_deep_dive
          default: ${var.enable_genie_deep_dive}
      performance_target: PERFORMANCE_OPTIMIZED
