variables:
  my_warehouse_id:
    description: The ID of a SQL warehouse for your dashboard and pipeline
    lookup:
      warehouse: "Serverless Starter Warehouse"
  catalog_name:
    description: The catalog containing your adoption dashboard tables
    default: users
  schema_name:
    description: The schema containing your adoption dashboard tables
    default: <your_schema>
  skip_get_conversations:
    description: Skip pulling all conversation content via API
    default: false
  enable_genie_deep_dive:
    description: |
      When true, the pipeline pulls Genie conversation/message content via the
      SDK into adb_genie_messages (slow on large workspaces). Required for the
      Genie deep-dive panel. When false (default), the deep-dive widget renders
      a placeholder and no SDK message fan-out runs.
    default: false
  force_reinit:
    description: |
      When true, the metadata notebook drops all adb_* tables at the
      start of its run and re-creates them fresh. Useful for a clean
      rebuild or for a V2→V3 schema migration. Default false.
    default: false
